<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1230"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5e9ff"/>
      <stop offset="1" stop-color="#b794f6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- terminal -->
  <g transform="translate(90 110)">
    <rect width="1020" height="680" rx="18" fill="#0d1117" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h984a18 18 0 0 1 18 18v38H0z" fill="#161b22"/>
    <circle cx="34" cy="28" r="8" fill="#ff5f57"/><circle cx="62" cy="28" r="8" fill="#febc2e"/><circle cx="90" cy="28" r="8" fill="#28c840"/>
    <text x="510" y="35" text-anchor="middle" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="20">shakespeare-transformer</text>

    <g font-family="Consolas, Menlo, monospace" font-size="25">
      <text x="40" y="112"><tspan fill="#a78bfa">$</tspan><tspan fill="#e6edf3"> python generate.py --prompt </tspan><tspan fill="#f2cc60">"JULIET:"</tspan></text>
      <text x="40" y="172" fill="#f0abfc" font-weight="bold">JULIET:</text>
      <text x="40" y="208" fill="#e6edf3">My lords, you know not when you can but grace.</text>
      <text x="40" y="268" fill="#f0abfc" font-weight="bold">DUKE VINCENTIO:</text>
      <text x="40" y="304" fill="#e6edf3">You are advised, and I can dispatch in them</text>
      <text x="40" y="340" fill="#e6edf3">That you are committed. You must, sir, if you</text>
      <text x="40" y="376" fill="#e6edf3">Have you been this disposition and length</text>
      <text x="40" y="412" fill="#e6edf3">The world could have straitly with the contrary.</text>
      <text x="40" y="500" fill="#8b949e"># 4.8M-parameter GPT, trained from scratch,</text>
      <text x="40" y="536" fill="#8b949e"># generating one character at a time.</text>
      <text x="40" y="596"><tspan fill="#a78bfa">$</tspan><tspan fill="#a78bfa"> █</tspan></text>
    </g>
  </g>

  <!-- quill -->
  <g transform="translate(1340 300) rotate(-28)">
    <path d="M0 -190 C70 -150 90 -40 40 70 L10 150 L-6 150 L-4 70 C-60 -20 -40 -140 0 -190 Z" fill="url(#quill)" opacity="0.95"/>
    <path d="M2 -170 L4 150" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#7c3aed" stroke-opacity="0.45" stroke-width="2">
      <path d="M3 -120 L40 -140"/><path d="M3 -80 L52 -96"/><path d="M3 -40 L56 -50"/><path d="M3 0 L50 -4"/>
      <path d="M3 -100 L-28 -122"/><path d="M3 -60 L-34 -76"/><path d="M3 -20 L-34 -30"/>
    </g>
    <path d="M-6 150 L10 150 L4 196 Z" fill="#2e1065"/>
  </g>
  <g font-family="system-ui, Segoe UI, sans-serif" text-anchor="middle">
    <text x="1355" y="610" fill="#f5f3ff" font-size="40" font-weight="700">Shakespeare GPT</text>
    <text x="1355" y="652" fill="#a1a1aa" font-size="24">Transformer from scratch</text>
  </g>
  <g fill="#e9d5ff" opacity="0.7">
    <circle cx="1230" cy="190" r="3"/><circle cx="1470" cy="250" r="2.5"/><circle cx="1500" cy="420" r="2"/><circle cx="1210" cy="470" r="2"/>
  </g>
</svg>
